# Server configuration
server.port=${SERVER_PORT:8080}

# MySQL Datasource Configuration with environment variable fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digitallocker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (SRS: 50MB max single file upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT Configuration (Min 256-bit secret key)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Application Storage and Quota Settings (SRS: 500MB default quota, 50MB max file size)
app.storage.location=${STORAGE_LOCATION:./uploads}
app.storage.default-quota=524288000
app.storage.max-file-size=52428800

# Swagger / OpenAPI documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
